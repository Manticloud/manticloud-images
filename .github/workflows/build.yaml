# Every image on every branch: build, check, scan, build again from scratch and compare. A v* tag also publishes,
# attests and writes the release. The build runs in podman's own image at a pinned version, so CI and a local
# `tools/build.py` build the same way.
name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests -v
      - id: matrix
        run: echo "matrix=$(python3 tools/build.py matrix)" >> "$GITHUB_OUTPUT"

  image:
    needs: test
    name: ${{ matrix.image }} ${{ matrix.branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    container:
      image: quay.io/podman/stable:v5.8.2@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      options: --privileged --volume /mnt/containers:/var/lib/containers
    env:
      IMAGE: ${{ matrix.image }}
      BRANCH: ${{ matrix.branch }}
      ONE: localhost/manti/${{ matrix.image }}:${{ matrix.branch }}-one
      TWO: localhost/manti/${{ matrix.image }}:${{ matrix.branch }}-two
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: python3 tools/build.py build "$IMAGE" "$BRANCH" "$ONE"
      - name: Check the commit, Ceph, the constraints and every driver
        run: python3 tools/build.py check "$IMAGE" "$BRANCH" "$ONE"
      - name: Scan
        run: python3 tools/build.py scan "$ONE" --out scan
      - name: Build again from scratch
        run: python3 tools/build.py build "$IMAGE" "$BRANCH" "$TWO" --no-cache
      - name: Compare the two builds
        run: python3 tools/compare_builds.py "$ONE" "$TWO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-${{ matrix.image }}-${{ matrix.branch }}
          path: scan/
          if-no-files-found: ignore

      - name: Publish
        id: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 tools/build.py version "$IMAGE" "$BRANCH" "$ONE")
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          echo "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push --digestfile digest "$ONE" "$name:$version"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"
          mkdir -p published
          printf '%s:%s@%s\n' "$name" "$version" "$(cat digest)" > "published/$IMAGE-$BRANCH.txt"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: scan/sbom.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: published-${{ matrix.image }}-${{ matrix.branch }}
          path: published/

  # The one check to require on main: it passes only if every image on every branch did, so adding a branch or an
  # image doesn't change what's required.
  images:
    needs: [test, image]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every image on every branch passed
        env:
          RESULTS: ${{ needs.test.result }} ${{ needs.image.result }}
        run: |
          echo "test and image: $RESULTS"
          [ "$RESULTS" = "success success" ]

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-*
          path: published
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat published/*.txt | sort > images.txt
          python3 tools/notes.py images.txt > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md images.txt
